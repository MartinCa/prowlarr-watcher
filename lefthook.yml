pre-commit:
  parallel: true
  commands:
    lint:
      root: "frontend/"
      glob: "*.{ts,tsx}"
      run: pnpm eslint --fix {staged_files} && pnpm prettier --write {staged_files}
      stage_fixed: true
    format:
      root: "frontend/"
      glob: "*.{json,css,md,js,mjs,html}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
